<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neondeck">
<meta name="theme-color" content="#050505">
<link rel="manifest" href="/manifest.webmanifest">
<script id="manifestToken">
// Runs before the page script: the manifest start_url must carry the token for iOS "Add to Home Screen"
(function () {
  try {
    var t = new URLSearchParams(location.search).get("token") || localStorage.getItem("neondeckToken") || localStorage.getItem("claudeDeckToken");
    if (t) document.querySelector('link[rel=manifest]').href = "/manifest.webmanifest?token=" + encodeURIComponent(t);
  } catch (e) {}
})();
</script>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Neondeck</title>
<style>
/*led-css:begin*/
:root {
  color-scheme: dark;
  --ground: #050505; --panel: #0c0b09; --unlit: #1d1a14; --amber: #ffb000; --amber-dim: #6b4a00;
  --led: #e8eefc; --led-mid: rgba(232,238,252,.62); --led-low: rgba(232,238,252,.32);
  --magenta: #ff2e88; --ok: #36e07a; --err: #ff4033; --rule: #1a1814;
  --prose: #cfcabf; --prose-2: #8f8a80;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.led { display: block; flex: none; }
.mq { overflow: hidden; min-width: 0; }
.mqi { display: inline-block; vertical-align: top; will-change: transform; }
.mq, .mqi { line-height: 0; font-size: 0; }
@keyframes marquee { 0%, 16% { transform: translateX(0); } 88%, 100% { transform: translateX(var(--shift)); } }
.mq.scroll .mqi { animation: marquee var(--dur) steps(var(--steps)) infinite; }

/* Tile: an LED module. .cq is the size container, .in carries the unlit dot field. */
.tile { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; min-width: 0; padding: 0; overflow: hidden;
  border: 1px solid #16140f; border-radius: 6px; background: var(--panel); color: var(--led);
  font: inherit; cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.tile .cq { position: absolute; inset: 0; container-type: inline-size; }
.tile .in { --f: calc(100cqw / 50); position: absolute; inset: 0; padding: calc(var(--f) * 3);
  display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: calc(var(--f) * 2);
  background-image: radial-gradient(circle, color-mix(in srgb, var(--unlit) 40%, transparent) 0 38%, transparent 42%); background-size: var(--f) var(--f); }
.tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
.tile:active .cq { opacity: .7; }
.tile .ico, .tile .mid { min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.tile .ico > svg, .tile .mid > svg { height: 100%; width: auto; max-width: 100%; }
.tile.act .ico .sq { height: 100%; width: auto; max-width: 52%; }
.tile.act .lbl { width: 100%; }
.tile.act .lbl .mq { display: flex; justify-content: center; }
.tile.act .lbl .mqi { margin: 0 auto; }
.tile.act .lbl .mq.scroll { display: block; }
.tile.tinted { background: color-mix(in srgb, var(--c) 12%, var(--panel)); }
.tile .sq { width: 52%; aspect-ratio: 1 / 1; display: grid; place-items: center; font-size: 30cqw; line-height: 1; }
.tile .sq img { width: 100%; height: 100%; object-fit: contain; display: block; image-rendering: auto; }
.tile:focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }
.tile.res-ok::after { box-shadow: inset 0 0 0 1px var(--ok); }
.tile.res-err::after { box-shadow: inset 0 0 0 1px var(--err); }
@media (prefers-reduced-motion: reduce) {
  .mq.scroll .mqi { animation: none; }
  .mq.scroll { -webkit-mask-image: linear-gradient(90deg, #000 78%, transparent); mask-image: linear-gradient(90deg, #000 78%, transparent); }
}
/*led-css:end*/
  :root { --hs: 1; }
  @media (max-width: 520px) { :root { --hs: .72; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: thin; scrollbar-color: #1a1814 transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #1a1814; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::selection { background: rgba(255, 46, 136, .3); }
  :focus-visible { outline: 2px solid var(--magenta); outline-offset: 2px; }
  html, body { margin: 0; height: 100%; background: var(--ground); overscroll-behavior: none; caret-color: var(--led);
    font-family: var(--sans); color: var(--prose); }
  body { display: grid; place-items: center; touch-action: manipulation; font-variant-numeric: tabular-nums; }

  /* Default: fill the viewport (phone remote). ?frame=1 keeps the fixed 800x480 Pi simulator. */
  #screen { width: 100vw; height: 100vh; height: 100dvh; background: var(--ground); display: flex; flex-direction: column;
    overflow: hidden; position: relative; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #screen.frame { width: 800px; height: 480px; padding: 0; border-radius: 6px; outline: 10px solid #161616; }

  header { height: 52px; flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    padding: 0 14px; border-bottom: 1px solid var(--rule); }
  .h-c { display: flex; align-items: center; gap: calc(10px * var(--hs)); min-width: 0; }
  .h-r { display: flex; align-items: center; justify-content: flex-end; gap: calc(14px * var(--hs)); min-width: 0; }
  .lamps { display: flex; align-items: center; gap: 10px; }
  .lamp { display: flex; align-items: center; gap: 4px; }
  .lamp i { width: 6px; height: 6px; border-radius: 50%; background: var(--unlit); flex: none; }
  .lamp.on i { background: var(--led); }
  .lamp.bad i { background: var(--err); }
  @media (max-width: 520px) { .lamp.t { display: none; } }

  main { flex: 1; display: grid; grid-template-columns: 60% 40%; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--rule); }
  /* Portrait / narrow: sessions grid on top (scrolls), actions grid pinned at the bottom */
  #screen[data-layout="narrow"] main { display: flex; flex-direction: column; }
  #screen[data-layout="narrow"] #paneS { flex: 1; }
  #screen[data-layout="narrow"] #paneA { flex: none; max-height: 46%; border-left: 0; border-top: 1px solid var(--rule); }
  #screen[data-layout="narrow"] #buttons { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #sessions { flex: 1; min-height: 0; }
  /* square tiles have overflow:hidden + aspect-ratio, so their min-content height is 0 and auto rows collapsed (tiles overlapped on iPhone) */
  .grid { overflow-y: auto; display: grid; gap: 8px; align-content: start; padding: 10px; grid-auto-rows: max-content; }
  #sessions { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  #buttons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 520px) { #screen[data-layout="narrow"] #sessions { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile.blank { pointer-events: none; cursor: default; }
  .empty { grid-column: 1 / -1; margin: auto; padding: 32px 16px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center; max-width: 100%; }
  .empty p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--prose-2); }
  #sessions:has(.empty) { display: flex; }

  /* Session tile */
  .ses .in { --s: calc(100cqw / 64); --m: calc(100cqw / 38); }
  .ses .in { grid-template-rows: auto minmax(calc(var(--f) * 12), 1fr) auto auto; }
  .ses .top { min-width: 0; }
  .ses .r1 { display: flex; align-items: flex-start; gap: calc(var(--s) * 3); min-width: 0; }
  .ses .sw { flex: 1 1 0; min-width: 0; }
  .ses .mk { display: none; flex: none; width: calc(var(--s) * 3); height: calc(var(--s) * 3); margin-top: calc(var(--s) * 2); border-radius: 50%; background: var(--amber); }
  .ses .chase { display: flex; gap: calc(var(--s) * 2); margin-top: calc(var(--s) * 3); }
  .ses .chase i { width: calc(var(--s) * 2); height: calc(var(--s) * 2); border-radius: 50%; background: var(--led); opacity: .22; animation: chase 1.2s steps(1) infinite; }
  .ses .chase i:nth-child(2) { animation-delay: .4s; }
  .ses .chase i:nth-child(3) { animation-delay: .8s; }
  @keyframes chase { 0% { opacity: 1; } 33.3% { opacity: .22; } }
  .ses .nm { min-width: 0; }
  .ses .nm .mq { min-height: calc(var(--f) * 7); }
  .ses .meta { min-width: 0; display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--s) * 3); min-height: calc(var(--s) * 7); }
  .ses .ag { flex: 1 1 0; min-width: 0; }
  .ses .hc { flex: none; margin-left: auto; }
  .ses .nt { position: absolute; top: 0; left: 0; }
  .tile.needs .sw { animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 0% { opacity: 1; } 66.67% { opacity: .12; } }
  .tile.needs::after { box-shadow: inset 0 0 0 1px var(--amber-dim); }
  .tile.focused::after { box-shadow: inset 0 0 0 1px var(--led-mid); }
  .tile.selected::after { box-shadow: inset 0 0 0 2px var(--magenta); }
  .tile.dis { opacity: .4; cursor: default; pointer-events: none; }
  .tile.wipe .cq, #hCount.wipe { animation: wipe .28s steps(var(--wipe-steps, 44)) 1; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @media (prefers-reduced-motion: reduce) {
    .tile.needs .sw { animation: none; }
    .ses .mk { display: block; }
    .ses .chase i { animation: none; opacity: .6; }
    .tile.wipe .cq, #hCount.wipe { animation: none; }
  }

  /* Gates: a centered panel with a dot-matrix headline */
  /* flex + margin:auto centres the board but keeps it scrollable when taller than the viewport (phone landscape) */
  .gate { position: fixed; inset: 0; z-index: 10; background: var(--ground); display: flex; overflow-y: auto; padding: 20px; }
  .gate > .board { margin: auto; }
  .gate[hidden] { display: none; }
  .board { width: min(440px, 100%); display: flex; flex-direction: column; gap: 16px; padding: 28px 24px;
    border: 1px solid var(--rule); border-radius: 6px; background-color: var(--panel);
    background-image: radial-gradient(circle, var(--unlit) 0 38%, transparent 42%); background-size: 6px 6px; }
  .board .hl { display: flex; min-width: 0; }
  .board p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--prose); }
  .board code { color: var(--prose); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; background: var(--ground); padding: 1px 6px; border-radius: 3px; }
  .board input { font: inherit; font-size: 16px; min-height: 56px; padding: 0 14px; border-radius: 6px;
    border: 1px solid var(--rule); background: #000; color: var(--prose); caret-color: var(--led); }
  .board input:focus { outline: 0; border-color: var(--led); }
  .board .primary { min-height: 56px; border: 0; border-radius: 6px; background: var(--led); color: #000; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font: inherit; }
  .board .primary:active { opacity: .7; }
  .board .secondary { min-height: 56px; border: 1px solid var(--led-low); border-radius: 6px; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font: inherit; }
  .board .secondary:active { opacity: .7; }
  .board .pv { display: flex; flex-direction: column; gap: 16px; }
  .board .pv .code { display: flex; justify-content: center; min-width: 0; }
  @media (max-height: 460px) { .board .pv { gap: 10px; } }
  .board [hidden] { display: none; }
  #camGate { z-index: 20; }
  .camframe { position: relative; aspect-ratio: 1 / 1; max-height: 52vh; align-self: center; width: 100%; background: #000; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; }
  .camframe video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camguide { position: absolute; inset: 18%; border: 2px solid var(--magenta); border-radius: 6px; pointer-events: none; }
  @media (max-height: 460px) { .camframe { max-height: 40vh; width: auto; } }

  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: 92%; display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--rule); padding: 8px 14px; border-radius: 6px;
    font: 13px/1.35 var(--sans); color: var(--prose); opacity: 0; pointer-events: none; white-space: pre-wrap; z-index: 5; }
  #toast.show { opacity: 1; }
  #toast.err { border-color: var(--err); }
  #toast.ok { border-color: var(--ok); }
  /* short viewports (phone landscape): compact gate board */
  @media (max-height: 460px) {
    .gate { padding: 10px; }
    .board { gap: 10px; padding: 16px 20px; }
    .board input, .board .primary, .board .secondary { min-height: 44px; }
  }
</style>
</head>
<body>
<div id="tokenGate" class="gate" hidden>
  <form id="tokenForm" class="board">
    <div class="hl" id="tokenHead" role="heading" aria-level="1"></div>
    <p id="tokenMsg">Tocca ABBINA e conferma il codice sul computer.</p>
    <button type="button" class="primary" id="pairBtn" aria-label="Abbina"></button>
    <input id="tokenInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Token" aria-label="Token">
    <button type="submit" class="secondary" id="tokenBtn" aria-label="Collega"></button>
    <button type="button" id="scanBtn" class="secondary" aria-label="Scansiona QR"></button>
    <div class="pv" id="pairView" hidden>
      <div class="code" id="pairCode" role="img"></div>
      <p>Sul computer approva questo codice (pannello admin o <code>neondeck pair</code>). Scade tra 2 minuti.</p>
      <button type="button" id="pairCancel" class="secondary" aria-label="Annulla"></button>
    </div>
    <input type="file" id="scanInput" accept="image/*" capture="environment" hidden>
  </form>
</div>
<div id="camGate" class="gate" hidden>
  <div class="board">
    <div class="hl" id="camHead" role="heading" aria-level="1"></div>
    <div class="camframe"><video id="camVideo" playsinline muted autoplay></video><i class="camguide"></i></div>
    <p id="camMsg" aria-live="polite">Inquadra il QR code mostrato sul computer.</p>
    <button type="button" id="camCancel" class="secondary" aria-label="Annulla"></button>
  </div>
</div>
<div id="netGate" class="gate" hidden>
  <div class="board">
    <div class="hl" id="netTitle" role="heading" aria-level="1"></div>
    <p id="netMsg">Il computer è su una rete non fidata. Sul computer: <code>neondeck trust</code></p>
  </div>
</div>
<div id="screen">
  <header>
    <div id="hWord"></div>
    <div class="h-c" id="hCount"></div>
    <div class="h-r"><div class="lamps" id="hLamps"></div><div id="hClock"></div></div>
  </header>
  <main>
    <div class="pane" id="paneS"><section id="sessions" class="grid" aria-label="Sessioni"></section></div>
    <div class="pane" id="paneA"><section id="buttons" class="grid" aria-label="Azioni"></section></div>
  </main>
  <div id="toast" role="status"></div>
</div>

// o.base + o.avail (both in cqw): shrink the cell so the string fits avail, never below 0.72 x base; the ticker covers the rest.
function ledLine(str, o = {}) {
  if (o.base && o.avail) {
    const c = Math.max(o.base * 0.72, Math.min(o.base, o.avail / Math.max(1, ledWidth(str))));
    o = { ...o, cell: c.toFixed(3) + "cqw" };

  const box = document.createElement("div");
  box.className = "mq";
  const inner = document.createElement("div");
  inner.className = "mqi";

}

function ledMeasure(root = document) {
  const boxes = Array.from(root.querySelectorAll(".mq"));
  const m = boxes.map((b) => {
    const svg = b.firstChild.firstChild, cols = +b.dataset.cols || 1;
    return { b, over: svg.getBoundingClientRect().width - b.clientWidth, cell: svg.getBoundingClientRect().width / cols };
  });
  for (const { b, over, cell } of m) {
    const run = over > 1 && cell > 0;
    b.classList.toggle("scroll", run);
    if (!run) continue;
    const steps = Math.ceil(over / cell) + 2;
    b.style.setProperty("--steps", steps);
    b.style.setProperty("--shift", `${-steps * cell}px`);
    b.style.setProperty("--dur", `${(steps * 0.14 + 2.6).toFixed(2)}s`);
  }
}

// Pairing: the phone shows a 6-digit code, the user approves it on the computer, the poll then returns the token.
let pairGen = 0;
function setPairing(on) {
  $("pairView").hidden = !on;
  for (const id of ["tokenMsg", "pairBtn", "tokenInput", "tokenBtn", "scanBtn"]) $(id).hidden = on;
  if (on) $("tokenGate").scrollTop = 0;

function stopPair() { pairGen++; setPairing(false); }
async function startPair() {
  const gen = ++pairGen;
  $("pairBtn").disabled = true;
  try {
    const r = await fetch("/api/pair", { method: "POST" });
    const d = await r.json().catch(() => ({}));
    if (gen !== pairGen) return;
    if (r.status === 403) return showGate("Il computer è su una rete non fidata. Sul computer: neondeck trust");
    if (!r.ok || !d.id) return showGate(d.error || "Impossibile avviare l'abbinamento. Riprova.");
    $("pairCode").replaceChildren(ledText(d.code, { cell: 8, color: LEDC.amber, fit: true }));
    $("pairCode").setAttribute("aria-label", "Codice " + d.code.split("").join(" "));
    setPairing(true);
    pollPair(gen, d.id, Date.now() + (d.expires_in || 120) * 1000);
  } catch {
    if (gen === pairGen) showGate("Impossibile contattare il computer. Riprova.");
  } finally { $("pairBtn").disabled = false; }
}
async function pollPair(gen, id, deadline) {
  while (gen === pairGen && !$("tokenGate").hidden) {
    await new Promise((res) => setTimeout(res, 1500));
    if (gen !== pairGen || $("tokenGate").hidden) return;
    if (Date.now() > deadline) return showGate("Richiesta scaduta: tocca di nuovo ABBINA.");
    let r, d;
    try {
      r = await fetch("/api/pair/" + encodeURIComponent(id));
      d = await r.json().catch(() => ({}));
    } catch { continue; }  // network hiccup: keep polling until expiry
    if (gen !== pairGen) return;
    if (r.status === 404) return showGate("Richiesta scaduta: tocca di nuovo ABBINA.");
    if (r.status === 403) return showGate("Il computer è su una rete non fidata. Sul computer: neondeck trust");
    if (r.status === 429) return showGate(d.error || "Troppi tentativi, riprova più tardi.");
    if (!r.ok) continue;
    if (d.state === "approved" && d.token) { stopPair(); return useToken(d.token); }

let jsqrLoading = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  if (!jsqrLoading) jsqrLoading = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "/vendor/jsQR.js";
    s.onload = () => res();
    s.onerror = () => { jsqrLoading = null; s.remove(); rej(new Error("load")); };

  });

  const url = URL.createObjectURL(file);

    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
function decodeAt(img, maxSide) {
  const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);

  cam = { stream, raf: 0, last: 0, cv: document.createElement("canvas") };
  const me = cam;
  const ctx = me.cv.getContext("2d", { willReadFrequently: true });
  msg.textContent = "Inquadra il QR code mostrato sul computer.";
  video.srcObject = stream;
  $("camGate").hidden = false;
  try { await video.play(); } catch {}
  const tick = (now) => {
    if (cam !== me) return;
    me.raf = requestAnimationFrame(tick);
    if (now - me.last < 150 || video.readyState < 2 || !video.videoWidth) return;
    me.last = now;
    const k = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
    const w = Math.max(1, Math.round(video.videoWidth * k)), h = Math.max(1, Math.round(video.videoHeight * k));
    me.cv.width = w; me.cv.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const hit = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "dontInvert" });
    if (!hit) return;
    const t = tokenFromQR((hit.data || "").trim());
    if (!t) { msg.textContent = "Questo QR code non è di Neondeck: riprova."; return; }
    stopCam();
    useToken(t);
  };
  me.raf = requestAnimationFrame(tick);
}
$("camCancel").onclick = stopCam;
document.addEventListener("visibilitychange", () => { if (document.hidden && cam) stopCam(); });
$("scanBtn").onclick = () => {
  if (window.isSecureContext && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) startCam();
  else $("scanInput").click();
};
$("scanInput").onchange = async () => {
  const f = $("scanInput").files[0];
  $("scanInput").value = "";
  if (!f) return;
  const msg = $("tokenMsg"), btn = $("scanBtn");
  msg.textContent = "Lettura del QR…";
  btn.disabled = true;
  try {
    try { await loadJsQR(); } catch { msg.textContent = "Impossibile caricare il lettore QR dal computer."; return; }
    const img = await loadImage(f);
    const hit = decodeAt(img, 1280) || decodeAt(img, 800);
    if (!hit) { msg.textContent = "Nessun QR code trovato nella foto: riprova più vicino e con più luce."; return; }
    const t = tokenFromQR(hit.data.trim());
    if (!t) { msg.textContent = "Questo QR code non contiene un token Neondeck."; return; }
    useToken(t);
  } catch {
    msg.textContent = "Nessun QR code trovato nella foto: riprova più vicino e con più luce.";
  } finally { btn.disabled = false; }
};

function connect() {
  if (!token) { showGate(); return; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { backoff = 500; setConn(true); $("netGate").hidden = true; };
  ws.onclose = (ev) => {
    setConn(false);
    if (ev.code === 4403 || ev.code === 4429) {  // untrusted network / too many attempts: keep retrying slowly
      headline($("netTitle"), ev.code === 4403 ? "RETE NON FIDATA" : "TROPPI TENTATIVI", LEDC.err);
      $("netMsg").innerHTML = ev.code === 4403
        ? "Il computer è su una rete non fidata. Sul computer: <code>neondeck trust</code>"
        : "Troppi tentativi con token errato. Riprova tra qualche minuto.";
      $("netGate").hidden = false;
      setTimeout(connect, 10000);
      return;
    }
    if (ev.code === 4401) {
      authFailed = true;
      token = "";
      try { localStorage.removeItem("neondeckToken"); localStorage.removeItem("claudeDeckToken"); } catch {}
      showGate("Token non valido o cambiato. Tocca ABBINA o incolla il token corrente.");
      return;
    }
    for (const [, p] of pending) p({ ok: false, detail: "Connessione persa" });
    pending.clear();
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 10000);
  };
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type === "state") {
      Object.assign(state, { sessions: m.sessions, buttons: m.buttons, procs: m.procs !== false,
        terminals: m.terminals || (m.iterm ? [{ id: "iterm", label: "iTerm2" }] : []) });
      if (state.selected !== null && !state.sessions.some((s) => s.id === state.selected && s.controllable)) state.selected = null;
      render();
    } else if (m.type === "result") {
      const cb = pending.get(m.req);
      if (cb) { pending.delete(m.req); cb(m); }
    }
  };
}

// Send a request over WS and wait for its "result" (10 s timeout)
function request(msg) {
  if (demo) return demoRequest(msg);
  return new Promise((resolve) => {
    if (!ws || ws.readyState !== 1) return resolve({ ok: false, detail: "Non connesso all'agent" });
    const req = ++reqId;
    pending.set(req, resolve);
    ws.send(JSON.stringify({ ...msg, req }));
    setTimeout(() => { if (pending.delete(req)) resolve({ ok: false, detail: "Nessuna risposta" }); }, 10000);
  });
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "ping" })); }, 15000);

function setConn(on) {
  state.conn = on;
  if (!on) state.terminals = [];
  renderHeader();
}

// ---- session classification
const isTerm = (s) => s.kind === "terminal";
const isNeeds = (s) => !isTerm(s) && s.controllable && (s.status === "idle" || /wait|permission|input/i.test(s.status || ""));
function sessionClass(s) {
  if (isTerm(s)) return "term";
  if (isNeeds(s)) return "needs";
  return ["busy", "shell"].includes(s.status) ? s.status : "other";
}
function sessionRank(s) {
  if (!s.controllable) return 5;
  if (isTerm(s)) return 4;
  return { needs: 0, busy: 1, shell: 2, other: 3 }[sessionClass(s)];
}
function sortedSessions(list) {
  return list.map((s, i) => [s, i]).sort(([a, i], [b, j]) => {
    const ra = sessionRank(a), rb = sessionRank(b);
    if (ra !== rb) return ra - rb;
    if (ra === 0) return (a.statusSince || Infinity) - (b.statusSince || Infinity) || i - j;
    return i - j;
  }).map(([s]) => s);
}

function relTime(ms) {
  if (!ms) return "";
  const min = Math.floor((Date.now() - ms) / 60000);
  if (min < 1) return "ORA";
  if (min < 60) return `${min} MIN`;
  const h = Math.floor(min / 60);
  if (h < 24) return `${h} H`;
  return `${Math.floor(h / 24)} G`;
}

const HOST_CODE = { iterm: "IT2", vscode: "VSC", tmux: "TMX", wezterm: "WZT", kitty: "KTY", other: "" };
const hostCode = (id) => (id in HOST_CODE ? HOST_CODE[id] : String(id || "").slice(0, 3).toUpperCase());
const compactLoc = (loc) => (loc || "").replaceAll(" · ", "·");

// ---- header
const hc = (px) => `calc(${px}px * var(--hs))`;
function lamp(code, cls) {
  const l = el("span", "lamp " + cls);
  l.append(el("i"), ledText(code, { cell: hc(1.6), color: LEDC.mid }));
  return l;
}
function renderClock() {
  const t = new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  $("hClock").replaceChildren(ledText(t, { cell: hc(2), color: LEDC.mid }));
}
let prevCount = null;
function renderHeader() {
  const word = $("hWord");
  if (!word.firstChild) word.append(ledText("NEONDECK", { cell: hc(2.2), color: LEDC.magenta }));
  const n = state.sessions.filter(isNeeds).length;
  const c = $("hCount");
  if (n > 0) c.replaceChildren(ledText("TOCCA A TE", { cell: hc(2), color: LEDC.amber }), ledText(String(n), { cell: hc(6), color: LEDC.amber }));
  else c.replaceChildren(ledText(state.sessions.length ? "TUTTO IN CORSO" : "NESSUNA SESSIONE", { cell: hc(2), color: LEDC.mid }));
  if (prevCount !== null && prevCount !== n) {
    const hs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hs")) || 1;
    c.style.setProperty("--wipe-steps", Math.max(1, Math.round(c.getBoundingClientRect().width / (2 * hs))));
    c.classList.remove("wipe"); void c.offsetWidth; c.classList.add("wipe");
    c.addEventListener("animationend", () => c.classList.remove("wipe"), { once: true });
  }
  prevCount = n;
  c.setAttribute("aria-label", n > 0 ? `${n} sessioni aspettano te` : state.sessions.length ? "Tutto in corso" : "Nessuna sessione");
  const lamps = $("hLamps");
  lamps.replaceChildren(lamp(demo ? "DEMO" : "LINK", demo || state.conn ? "on" : ""));
  if (state.terminals.length) for (const t of state.terminals) lamps.append(lamp(hostCode(t.id), "t on"));
  else lamps.append(lamp("TRM", "t"));
  if (!state.procs) lamps.append(lamp("PRC", "bad"));
  renderClock();
}

// ---- tiles
const isWide = () => $("screen").dataset.layout === "wide";
const sessionCols = () => (!isWide() && innerWidth <= 520 ? 3 : 4);
function blankTile() {
  const t = el("div", "tile blank"), cq = el("div", "cq");
  cq.append(el("div", "in")); t.append(cq);
  t.setAttribute("aria-hidden", "true");
  return t;
}
function padBlanks(box, count, cols, min = 0) {
  const total = Math.ceil(Math.max(count, min) / cols) * cols;
  for (let i = count; i < total; i++) box.append(blankTile());
}
const prevStatus = new Map();
const WIPE_COLS = 50; // dot columns across a tile: .in pitch is 100cqw / 50
let sessionsSig = "", buttonsSig = "";

function sessionTile(s, wipe) {
  const cls = sessionClass(s), term = cls === "term", dis = !s.controllable;
  const ink = dis ? { sw: LEDC.low, ic: LEDC.low, nm: LEDC.led }
    : cls === "needs" ? { sw: LEDC.amber, ic: LEDC.amber, nm: LEDC.amber }
    : cls === "other" ? { sw: LEDC.low, ic: LEDC.low, nm: LEDC.led }
    : term ? { sw: LEDC.mid, ic: s.focused ? LEDC.led : LEDC.mid, nm: LEDC.led }
    : { sw: LEDC.mid, ic: LEDC.mid, nm: LEDC.led };
  const word = term ? (s.title || "").toUpperCase() : cls === "needs" ? "TOCCA A TE" : cls === "busy" ? "IN CORSO"
    : cls === "shell" ? "$ COMANDO" : ({ idle: "INATTIVA", stopped: "FERMA" })[s.status] || "ALTRO";
  const name = term ? (s.project || compactLoc(s.loc)) : (s.project || s.name);
  const age = dis ? "SOLO VISTA" : term ? (s.project ? compactLoc(s.loc) : "") : relTime(s.statusSince);
  const t = el("button", "tile ses " + (dis ? "dis " : "") + cls + (s.focused ? " focused" : "") + (s.id === state.selected ? " selected" : "")
    + (wipe ? " wipe" : ""));
  t.type = "button";
  t.style.setProperty("--wipe-steps", WIPE_COLS);
  t.title = [s.cwd || s.name, s.loc].filter(Boolean).join("  ");
  t.setAttribute("aria-label", `${name || word}: ${word}`);
  if (dis) t.setAttribute("aria-disabled", "true");
  const cq = el("div", "cq"), inn = el("div", "in");
  const small = "calc(100cqw / 64)", big = "calc(100cqw / 50)";

  const top = el("div", "top"), r1 = el("div", "r1");
  if (cls === "needs") r1.append(el("i", "mk"));
  const sw = el("div", "sw");
  sw.append(ledLine(word, { base: 100 / 64, avail: cls === "needs" ? 78 : 88, color: ink.sw }));
  r1.append(sw);
  top.append(r1);
  if (cls === "busy") { const ch = el("div", "chase"); ch.append(el("i"), el("i"), el("i")); top.append(ch); }

  const mid = el("div", "mid");
  mid.append(ledBitmap(term ? LED.terminal : LED.mascot, { cell: "calc(100cqw / 38)", color: ink.ic, fill: true }));

  const nm = el("div", "nm");
  nm.append(ledLine(String(name || "").toUpperCase(), { base: 2, avail: 88, color: ink.nm }));

  const host = hostCode(s.host), meta = el("div", "meta");
  const hostW = host ? ledWidth(host) * (100 / 64) + 3 * (100 / 64) : 0;
  const base = 100 / 64, ageAvail = 88 - hostW;
  const metaCell = (age ? Math.max(base * 0.72, Math.min(base, ageAvail / Math.max(1, ledWidth(age)))) : base).toFixed(3) + "cqw";
  const metaInk = dis ? LEDC.low : LEDC.mid;
  const ag = el("div", "ag");
  if (age) ag.append(ledLine(age, { cell: metaCell, color: metaInk }));
  meta.append(ag);
  if (host) { const h = el("div", "hc"); h.append(ledText(host, { cell: metaCell, color: metaInk })); meta.append(h); }

  inn.append(top, mid, nm, meta);
  cq.append(inn);
  if (s.id === state.selected) { const nt = el("div", "nt"); nt.append(ledBitmap("###|##.|#..", { cell: "calc(100cqw / 42)", color: LEDC.magenta })); cq.append(nt); }
  t.append(cq);
  if (s.controllable) {
    t.onclick = async () => {
      if (navigator.vibrate) navigator.vibrate(10);
      state.selected = s.id;
      renderSessions();
      const r = await request({ type: "focus", id: s.id });
      if (!r.ok) toast(r.detail, false);
    };
  }
  return t;
}

function renderSessions() {
  const list = sortedSessions(state.sessions);
  const cols = sessionCols();
  const sig = JSON.stringify([list, state.selected, Math.floor(Date.now() / 60000), cols]);
  if (sig === sessionsSig) return;
  sessionsSig = sig;
  const box = $("sessions");
  box.replaceChildren();
  if (!list.length) {
    const e = el("div", "empty");
    const h = el("div", "hl", ""); headline(h, "NESSUNA SESSIONE", LEDC.mid, 3);
    e.append(h, el("p", "", "Avvia Claude Code in un terminale: la sessione comparirà qui."));
    box.append(e);
    return;
  }
  const seen = new Set();
  for (const s of list) {
    const key = isTerm(s) ? "t:" + s.title : "s:" + s.status;
    seen.add(s.id);
    box.append(sessionTile(s, prevStatus.has(s.id) && prevStatus.get(s.id) !== key));
    prevStatus.set(s.id, key);
  }
  for (const id of prevStatus.keys()) if (!seen.has(id)) prevStatus.delete(id);
  padBlanks(box, list.length, cols);
  requestAnimationFrame(() => {
    ledMeasure(box);
    for (const t of box.querySelectorAll(".tile.wipe")) {
      const w = t.clientWidth;
      if (w > 0) t.style.setProperty("--wipe-steps", Math.max(1, Math.round(w / (w / WIPE_COLS))));
    }
  });
}

function renderButtons() {
  const wide = isWide();
  const sig = JSON.stringify([state.buttons, wide]);
  if (sig === buttonsSig) return;
  buttonsSig = sig;
  const box = $("buttons");
  box.replaceChildren();
  for (const b of state.buttons) {
    const btn = ledActionTile(b);
    btn.onclick = async () => {
      if (navigator.vibrate) navigator.vibrate(10);
      const r = await request({ type: "press", id: b.id, target_id: state.selected });
      btn.classList.add(r.ok ? "res-ok" : "res-err");
      const lbl = btn.querySelector(".lbl"), old = Array.from(lbl.childNodes);
      if (r.ok) {
        const ok = el("div", "mq"); ok.style.display = "flex"; ok.style.justifyContent = "center";
        ok.append(ledText("OK", { cell: "calc(100cqw / 50)", color: LEDC.ok }));
        lbl.replaceChildren(ok);
      }
      setTimeout(() => { btn.classList.remove("res-ok", "res-err"); if (r.ok) { lbl.replaceChildren(...old); } }, 600);
      toast(r.detail || (r.ok ? "Fatto" : "Errore"), r.ok);
    };
    box.append(btn);
  }
  padBlanks(box, state.buttons.length, wide ? 3 : 4, wide ? 12 : 0);
  requestAnimationFrame(() => ledMeasure(box));
}

let toastTimer;
function toast(text, ok) {
  const t = $("toast");
  const msg = el("span", "", text);
  t.replaceChildren(ledText(ok ? "OK" : "ERRORE", { cell: 2, color: ok ? LEDC.ok : LEDC.err }), msg);
  t.className = "show " + (ok ? "ok" : "err");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), 2200);
}

function render() { renderHeader(); renderSessions(); renderButtons(); }

setInterval(renderClock, 5000);
setInterval(renderSessions, 30000); // refresh relative times

// ---- Demo mode: realistic fake state, everything stays local
function startDemo() {
  const ago = (min) => Date.now() - min * 60000;
  const claude = (n, project, status, min, host, loc, controllable = true) => ({
    kind: "claude", id: `claude:${4100 + n}`, pid: 4100 + n, name: project, project, cwd: `/Users/alice/dev/${project}`,
    status, statusSince: ago(min), host, loc, controllable, focused: false });
  const term = (n, title, project, loc, focused = false) => ({
    kind: "terminal", id: `iterm:T${n}`, pid: null, name: title, title, project, loc, host: "iterm",
    status: "terminal", controllable: true, focused });
  const key = (id, title, glyph, text) => ({ id, title, icon: { type: "glyph", value: glyph },
    action: { type: "send_keys", text, target: "current" } });
  Object.assign(state, {
    terminals: [{ id: "iterm", label: "iTerm2" }, { id: "vscode", label: "VS Code" }], procs: true,
    sessions: [
      claude(1, "webshop", "busy", 3, "iterm", "F1 · T1"),
      claude(2, "infra", "idle", 12, "iterm", "F1 · T2"),
      claude(3, "docs-site", "busy", 1, "vscode", null),
      claude(4, "data-pipeline-orchestrator", "idle", 47, "iterm", "F2 · T1"),
      claude(5, "mobile-app", "shell", 8, "iterm", "F2 · T2"),
      claude(7, "scratch", "idle", 300, "other", null, false),
      term(1, "zsh", "webshop", "F1 · T3", true),
      term(2, "vim", "blog-engine", "F2 · T3"),
      term(3, "ssh", "", "F3 · T1"),
      term(4, "htop", "", "F3 · T2"),
    ],
    buttons: [
      key("b1", "Esc", "esc", "\u001b"), key("b2", "Invio", "enter", "\r"),
      key("b3", "Interrompi", "stop", "\u0003"), key("b4", "Cambia modalità", "mode", "\u001b[Z"),
      { id: "b5", title: "Deploy", icon: { type: "glyph", value: "rocket" }, color: "#4cd0ff",
        action: { type: "shell", command: "./deploy.sh", timeout: 60 } },
      { id: "b6", title: "Documentazione", icon: { type: "glyph", value: "book" }, color: "#b69cff",
        action: { type: "open_url", url: "https://example.com/docs" } },
    ],
  });
  state.selected = "claude:4102";
  setConn(true);
  render();
}

function demoRequest(msg) {
  if (msg.type === "focus") {
    for (const s of state.sessions) s.focused = s.id === msg.id;
    renderSessions();
    return Promise.resolve({ ok: true, detail: "Demo" });
  }
  const b = state.buttons.find((x) => x.id === msg.id);
  return Promise.resolve({ ok: true, detail: `Demo: «${b ? b.title : "?"}»` });
}

// Layout: side-by-side in any landscape viewport (phones included), stacked in portrait
function layout() {
  const scr = $("screen");
  scr.classList.toggle("frame", frameMode);
  const wide = frameMode || innerWidth > innerHeight;
  scr.dataset.layout = wide ? "wide" : "narrow";
  ledMeasure();
}
addEventListener("resize", () => { layout(); renderSessions(); renderButtons(); });
layout();
render();
if (demo) startDemo(); else connect();
</script>
